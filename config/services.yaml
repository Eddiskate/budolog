parameters:
    app.contact_email_fallback: 'kontakt@budolog.pl'
    app.contact_email: '%env(default:app.contact_email_fallback:CONTACT_EMAIL)%'
    app.default_uri_fallback: 'https://budolog.pl'
    app.trusted_proxies_fallback: 'REMOTE_ADDR'
    app.blog_api_url_fallback: 'https://web-portal.pl'
    app.blog_api_key_fallback: ''
    app.blog_api_url: '%env(default:app.blog_api_url_fallback:BLOG_API_URL)%'
    app.blog_api_key: '%env(default:app.blog_api_key_fallback:BLOG_API_KEY)%'
    app.guides_file: '%kernel.project_dir%/config/guides.yaml'
    app.affiliates_file: '%kernel.project_dir%/config/affiliates.yaml'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\GuideRepository:
        arguments:
            $guidesFile: '%app.guides_file%'

    App\Service\AffiliateRepository:
        arguments:
            $affiliatesFile: '%app.affiliates_file%'

    App\Service\BlogApiClient:
        arguments:
            $blogApiUrl: '%app.blog_api_url%'
            $blogApiKey: '%app.blog_api_key%'

    App\Twig\AppExtension:
        arguments:
            $contactEmail: '%app.contact_email%'
